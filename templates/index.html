<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INE - Tasas de Paro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a4d8f 0%, #2d6bc4 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .api-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .api-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .api-card h2 {
            color: #1a4d8f;
            font-size: 1.5em;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        .api-card p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .api-card .view-btn {
            display: inline-block;
            background: #1a4d8f;
            color: white;
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        
        .api-card .view-btn:hover {
            background: #2d6bc4;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 INE - Tasas de Paro</h1>
            <p>Consulta las diferentes APIs del Instituto Nacional de Estadística para obtener información sobre tasas de paro</p>
        </div>
        
        <div class="api-grid">
            {% for api in apis %}
            <div class="api-card" onclick="window.location.href='/api/{{ api.id }}'">
                <h2>{{ api.name }}</h2>
                <p>{{ api.description }}</p>
                <a href="/api/{{ api.id }}" class="view-btn">Ver Parámetros</a>
            </div>
            {% endfor %}
        </div>
        
        <div class="footer">
            <p>© 2024 - Aplicación de Consulta de Tasas de Paro del INE</p>
        </div>
    </div>
</body>
</html>
